name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build
        run: nix develop -c zig build
      - name: Unit and integration tests
        run: nix develop -c zig build test
      - name: Smoke tests
        run: nix develop -c zig build smoke
      - name: Format check
        run: nix develop -c zig fmt --check build.zig src
      - name: PTY smoke
        run: nix develop -c tests/pty_smoke.sh
      - name: Lua examples
        run: nix develop -c luajit examples/verify.lua
